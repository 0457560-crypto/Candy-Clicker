<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title> Candy Clicker </title>
</head>

<body>
    <div id="header">
        <h1> You owe the <em class="emph1"> SUGAR MAFIA </em> <b class="emph2"> 5000 </b> pieces of candy. </h1>
        <h3> <em> Better get to clicking! </em> </h3>
    </div>

    <!--Get efficiency stats and click click click!-->
    <div id="main">
        <p id="candy"> Candies: 0 </p>
        <p id="candy-to-click"> Candies/Click: 1 </p>
        <button id="candy-btn"> Click Me! </button>
    </div>

    <!--Buy Upgrades Here!-->
    <div id="shop">
        <button id="upgrade-click-btn"> -> Increase You Candies Per Click <-| 25 </button>
    </div>

    <!--This is a challenge! Gamble a percentage of your current candies, 
        and get differing amounts of rewards. Higher risk, higher rewards.
    <div class="gambling">
        <p> Gamble Here </p>
    </div>
    -->
    <script src="script.js"></script>
</body>

</html>
